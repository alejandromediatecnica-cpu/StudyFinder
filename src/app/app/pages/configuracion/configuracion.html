<div class="settings-page">
  <header class="page-header">
    <div>
      <div class="eyebrow">PREFERENCIAS</div>
      <h1>Configuración</h1>
      <p>Personaliza cómo funciona tu espacio de estudio.</p>
    </div>
  </header>

  <section class="settings-card">
    <div class="setting-row">
      <div class="setting-copy">
        <strong>Tema oscuro</strong>
        <span>Usa el fondo oscuro de StudyFinder</span>
      </div>
      <button
        type="button"
        class="toggle"
        [class.on]="darkTheme()"
        [attr.aria-pressed]="darkTheme()"
        aria-label="Tema oscuro"
        (click)="alternarTema()"
      >
        <span></span>
      </button>
    </div>
  </section>
</div>
