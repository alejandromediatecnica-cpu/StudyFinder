<div class="dashboard-shell">
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">S</div>
      <div>
        <strong>StudyFinder</strong>
        <span>Smart Learning</span>
      </div>
    </div>

    <div class="sidebar-label">Workspace</div>
    <nav>
      <a routerLink="/main" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <span class="nav-icon">⌂</span><span>Inicio</span>
      </a>
      <a routerLink="/materias" routerLinkActive="active">
        <span class="nav-icon">▦</span><span>Mis materias</span>
      </a>
      <a routerLink="/calendario" routerLinkActive="active">
        <span class="nav-icon">□</span><span>Calendario</span>
      </a>
      <a routerLink="/tareas" routerLinkActive="active">
        <span class="nav-icon">✓</span><span>Tareas</span>
      </a>
      <a routerLink="/ia" routerLinkActive="active">
        <span class="nav-icon">✦</span><span>Study AI</span>
      </a>
      <a routerLink="/estadisticas" routerLinkActive="active">
        <span class="nav-icon">◒</span><span>Estadísticas</span>
      </a>
    </nav>

    <div class="sidebar-bottom">
      <a routerLink="/configuracion" routerLinkActive="active">
        <span class="nav-icon">⚙</span><span>Configuración</span>
      </a>
      <div class="profile-mini">
        <div class="avatar">A</div>
        <div>
          <strong>Estudiante</strong>
          <span>Cuenta personal</span>
        </div>
        <span class="profile-dot"></span>
      </div>
    </div>
  </aside>

  <main class="content-area">
    <header class="topbar">
      <div class="breadcrumb">
        <span>StudyFinder</span>
        <b>/</b>
        <span>Workspace</span>
      </div>
      <div class="topbar-actions">
        <button class="icon-button" aria-label="Notificaciones">♢</button>
        <button class="user-button">
          <span class="avatar small">A</span>
          <span>Mi perfil</span>
          <span class="chevron">⌄</span>
        </button>
      </div>
    </header>

    <section class="page-content">
      <router-outlet></router-outlet>
    </section>
  </main>
</div>
