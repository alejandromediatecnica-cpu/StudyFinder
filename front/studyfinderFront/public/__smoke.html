<!doctype html>
<!-- Harness temporal de comprobacion: fija tema y usuario en el mismo origen
     que la app y luego la carga en un iframe a pantalla completa. -->
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>cargando</title>
  <style>html,body{margin:0;height:100%}iframe{width:100vw;height:100vh;border:0;display:block}</style>
  <script>
    var p = new URLSearchParams(location.search);
    localStorage.setItem('studyfinder_theme', p.get('tema') === 'light' ? 'light' : 'dark');
    localStorage.setItem('studyfinder_token', 'smoke');
    localStorage.setItem('studyfinder_user', JSON.stringify({ id: 1, name: 'Ada', email: 'ada@x.com' }));
    localStorage.setItem('studyfinder_data_1', JSON.stringify({ searches: [], saved: [], stats: { searches: 0, downloads: 0, completed: 0 } }));
  </script>
</head>
<body>
  <iframe id="marco" src="/"></iframe>
</body>
</html>
